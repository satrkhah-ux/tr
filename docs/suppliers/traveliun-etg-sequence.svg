<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 1010" width="1180" height="1010" font-family="Segoe UI, Arial, sans-serif">
  <rect width="1180" height="1010" fill="#ffffff"/>

  <!-- title -->
  <text x="40" y="44" font-size="21" font-weight="700" fill="#0f3d38">Traveliun — ETG / RateHawk API booking flow</text>
  <text x="40" y="68" font-size="13" fill="#6b807b">Search → Select → Prebook (recheck) → Client offer → Book → Voucher → Cancel</text>
  <line x1="40" y1="82" x2="1140" y2="82" stroke="#d9e4e0" stroke-width="1"/>

  <!-- lifelines -->
  <g font-size="12.5" font-weight="700" text-anchor="middle">
    <rect x="60"  y="100" width="150" height="40" rx="8" fill="#185045"/><text x="135" y="125" fill="#fff">Sales agent</text>
    <rect x="270" y="100" width="190" height="40" rx="8" fill="#0f3d38"/><text x="365" y="125" fill="#fff">Traveliun system</text>
    <rect x="520" y="100" width="160" height="40" rx="8" fill="#2b57c4"/><text x="600" y="125" fill="#fff">ETG API</text>
    <rect x="740" y="100" width="150" height="40" rx="8" fill="#7a5230"/><text x="815" y="125" fill="#fff">Client</text>
    <rect x="950" y="100" width="170" height="40" rx="8" fill="#a33b5a"/><text x="1035" y="125" fill="#fff">Operations</text>
  </g>
  <g stroke="#c8d5d0" stroke-width="1.4" stroke-dasharray="5 5">
    <line x1="135"  y1="140" x2="135"  y2="960"/>
    <line x1="365"  y1="140" x2="365"  y2="960"/>
    <line x1="600"  y1="140" x2="600"  y2="960"/>
    <line x1="815"  y1="140" x2="815"  y2="960"/>
    <line x1="1035" y1="140" x2="1035" y2="960"/>
  </g>

  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#33504a"/>
    </marker>
    <marker id="b" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#2b57c4"/>
    </marker>
  </defs>

  <g font-size="12" fill="#22423c">
    <!-- 1 SEARCH -->
    <text x="60" y="176" font-size="11.5" font-weight="700" fill="#93aaa3">1 — SEARCH</text>
    <line x1="135" y1="192" x2="358" y2="192" stroke="#33504a" stroke-width="1.6" marker-end="url(#a)"/>
    <text x="150" y="187">city · dates · rooms · guests · nationality</text>

    <line x1="365" y1="222" x2="593" y2="222" stroke="#2b57c4" stroke-width="1.6" marker-end="url(#b)"/>
    <text x="378" y="217" fill="#2b57c4">Search by region / hotel IDs — timeout 25 s</text>
    <text x="378" y="238" font-size="11" fill="#7d8f9b">all enabled suppliers queried in parallel</text>

    <line x1="600" y1="266" x2="372" y2="266" stroke="#2b57c4" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#b)"/>
    <text x="380" y="261" fill="#2b57c4">rates + cancellation policy</text>

    <rect x="252" y="282" width="226" height="46" rx="7" fill="#f2f7f5" stroke="#cfe0d9"/>
    <text x="264" y="300" font-size="11">markup rules + minimum margin floor</text>
    <text x="264" y="318" font-size="11">FX → SAR, rate pinned at quotation time</text>

    <line x1="358" y1="352" x2="142" y2="352" stroke="#33504a" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#a)"/>
    <text x="150" y="347">aggregated by hotel · room type · board type</text>

    <!-- 2 SELECT + PREBOOK -->
    <text x="60" y="392" font-size="11.5" font-weight="700" fill="#93aaa3">2 — SELECT &amp; PREBOOK (recheck)</text>
    <line x1="135" y1="408" x2="358" y2="408" stroke="#33504a" stroke-width="1.6" marker-end="url(#a)"/>
    <text x="150" y="403">agent picks the rate</text>

    <line x1="365" y1="438" x2="593" y2="438" stroke="#2b57c4" stroke-width="1.6" marker-end="url(#b)"/>
    <text x="378" y="433" fill="#2b57c4">Prebook — MANDATORY, timeout 25 s</text>

    <line x1="600" y1="468" x2="372" y2="468" stroke="#2b57c4" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#b)"/>
    <text x="380" y="463" fill="#2b57c4">confirmed price · availability · policy</text>

    <rect x="120" y="484" width="380" height="44" rx="7" fill="#fff6f8" stroke="#e8b9c6"/>
    <text x="132" y="502" font-size="11" font-weight="700" fill="#a33b5a">alt — price or policy differs from search</text>
    <text x="132" y="520" font-size="11" fill="#a33b5a">surfaced to the agent; never passed through silently (0 % tolerance)</text>

    <!-- 3 CLIENT OFFER -->
    <text x="60" y="566" font-size="11.5" font-weight="700" fill="#93aaa3">3 — CLIENT OFFER</text>
    <line x1="365" y1="582" x2="808" y2="582" stroke="#33504a" stroke-width="1.6" marker-end="url(#a)"/>
    <text x="380" y="577">offer PDF — SELL prices only</text>
    <text x="380" y="598" font-size="11" fill="#7d8f9b">buy price and margin never leave the system</text>

    <line x1="815" y1="628" x2="142" y2="628" stroke="#33504a" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#a)"/>
    <text x="380" y="623">client approves</text>

    <!-- 4 BOOK -->
    <text x="60" y="668" font-size="11.5" font-weight="700" fill="#93aaa3">4 — BOOK</text>
    <line x1="135" y1="684" x2="1028" y2="684" stroke="#33504a" stroke-width="1.6" marker-end="url(#a)"/>
    <text x="500" y="679">handover to operations</text>

    <rect x="905" y="700" width="260" height="42" rx="7" fill="#fdf2f6" stroke="#e8b9c6"/>
    <text x="917" y="717" font-size="11" font-weight="700" fill="#a33b5a">ONE human press — never automatic</text>
    <text x="917" y="734" font-size="11" fill="#a33b5a">requires operations.book permission</text>

    <line x1="1035" y1="768" x2="372" y2="768" stroke="#33504a" stroke-width="1.6" marker-end="url(#a)"/>
    <text x="500" y="763">confirm booking</text>

    <line x1="365" y1="796" x2="593" y2="796" stroke="#2b57c4" stroke-width="1.6" marker-end="url(#b)"/>
    <text x="378" y="791" fill="#2b57c4">Book — timeout 120 s</text>

    <line x1="600" y1="826" x2="372" y2="826" stroke="#2b57c4" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#b)"/>
    <text x="380" y="821" fill="#2b57c4">booking reference + Hotel Confirmation Number</text>

    <rect x="252" y="842" width="226" height="30" rx="7" fill="#f2f7f5" stroke="#cfe0d9"/>
    <text x="264" y="861" font-size="11">written to audit log, by name</text>

    <!-- 5 VOUCHER + CANCEL -->
    <text x="60" y="900" font-size="11.5" font-weight="700" fill="#93aaa3">5 — VOUCHER &amp; POST-BOOKING</text>
    <line x1="365" y1="916" x2="808" y2="916" stroke="#33504a" stroke-width="1.6" marker-end="url(#a)"/>
    <text x="380" y="911">voucher carrying the HCN, behind an unguessable token</text>

    <line x1="365" y1="946" x2="593" y2="946" stroke="#2b57c4" stroke-width="1.6" stroke-dasharray="2 3" marker-end="url(#b)"/>
    <text x="378" y="941" fill="#2b57c4">opt — Cancel (60 s) · Order details (30 s) — human press, logged</text>
  </g>

  <text x="40" y="990" font-size="10.5" fill="#93aaa3">Traveliun Travel &amp; Tourism · outbound IP 186.241.16.106 · no automatic booking at any step</text>
</svg>
